<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RHYMEX — Entrar</title>

  <!-- Tipografias: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>


  <style>
    /* ==========================================
       1. VARIÁVEIS E PALETA RHYMEX
       ========================================== */
    :root {
      --bg-base: #090A0F;
      --bg-surface: #12141D;
      --bg-card: #181A26;
      --bg-hover: #202333;

      --purple-main: #8B5CF6;
      --purple-bright: #A855F7;
      --purple-dark: #3B0764;
      --purple-glow: rgba(139, 92, 246, 0.15);

      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --text-dark: #6B7280;

      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-purple: rgba(139, 92, 246, 0.3);

      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;

      --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background graphics */
    body::before {
      content: '';
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, var(--purple-glow) 0%, transparent 70%);
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(59, 7, 100, 0.2) 0%, transparent 70%);
      bottom: -100px;
      z-index: 0;
      pointer-events: none;
    }

    /* Grid de textura sutil */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
      z-index: 0;
      pointer-events: none;
    }

    /* Wrapper do Login */
    .login-container {
      width: 100%;
      max-width: 420px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: mountFade 0.6s ease forwards;
    }

    @keyframes mountFade {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Top Branding */
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      font-family: var(--font-main);
      font-weight: 900;
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      position: relative;
    }

    .brand-logo span {
      background: linear-gradient(135deg, var(--text-main) 40%, var(--purple-bright) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-logo .dot {
      width: 8px;
      height: 8px;
      background-color: var(--purple-main);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--purple-bright);
      display: inline-block;
      -webkit-text-fill-color: initial;
    }

    .brand-tagline {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    /* Auth Card */
    .auth-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(139, 92, 246, 0.03);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(8px);
      transition: var(--transition-normal);
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--purple-main), transparent);
      opacity: 0.6;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
      letter-spacing: -0.2px;
    }

    .card-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 28px;
    }

    /* Botão Google */
    .btn-google {
      width: 100%;
      height: 52px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-family: var(--font-main);
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: var(--transition-normal);
      position: relative;
      overflow: hidden;
    }

    .btn-google:hover {
      background-color: var(--bg-hover);
      border-color: var(--border-purple);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), 0 0 20px var(--purple-glow);
    }

    .btn-google:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .google-icon-wrapper {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Estado de Loading Spinner */
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--purple-bright);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Alertas / Mensagens de Estado */
    .status-message {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      display: none;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.25s ease forwards;
    }

    .status-message.error {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }

    .status-message.success {
      background-color: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #6ee7b7;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Rodapé do Card (Termos) */
    .terms-text {
      font-size: 0.72rem;
      color: var(--text-dark);
      text-align: center;
      line-height: 1.5;
      margin-top: 24px;
    }

    .terms-text a {
      color: var(--text-muted);
      text-decoration: none;
      transition: var(--transition-fast);
      border-bottom: 1px solid transparent;
    }

    .terms-text a:hover {
      color: var(--purple-bright);
      border-bottom-color: var(--purple-bright);
    }


    /* Tela de Transição pós-Sucesso */
    .app-redirect-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-base);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .app-redirect-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    /* Responsividade Mobile-First */
    @media (max-width: 480px) {
      .auth-card {
        padding: 24px 20px;
        border-radius: var(--radius-md);
      }

      .brand-logo {
        font-size: 1.9rem;
      }

      .card-title {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>

  <!-- Textura de Fundo -->
  <div class="bg-grid"></div>

  <div class="login-container">
    
    <!-- Topo / Identidade -->
    <header class="brand-header">
      <div class="brand-logo">
        <span>RHYMEX</span><span class="dot"></span>
      </div>
      <p class="brand-tagline">Entre no seu ritmo.</p>
    </header>

    <!-- Card Principal de Login -->
    <main class="auth-card">
      <h1 class="card-title">Bem-vindo ao RHYMEX</h1>
      <p class="card-subtitle">Entre com sua conta Google para continuar.</p>

      <!-- Botão Único Google -->
      <button id="google-login-btn" class="btn-google" onclick="handleGoogleLogin()">
        <span class="google-icon-wrapper" id="google-icon">
          <!-- SVG Oficial Google -->
          <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
        </span>
        <div class="spinner" id="btn-spinner"></div>
        <span id="btn-text">Continuar com Google</span>
      </button>

      <!-- Mensagens de Estado -->
      <div id="status-box" class="status-message">
        <i id="status-icon" data-lucide="alert-circle" style="width: 14px; height: 14px;"></i>
        <span id="status-text">Mensagem de aviso</span>
      </div>

      <!-- Informações Legais -->
      <p class="terms-text">
        Ao continuar, você concorda com os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a> do RHYMEX.
      </p>
    </main>


  </div>

  <!-- Overlay de Transição / Sucesso pós-login -->
  <div id="redirect-overlay" class="app-redirect-overlay">
    <div class="brand-logo" style="margin-bottom: 12px;">
      <span>RHYMEX</span><span class="dot"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 0.85rem;">
      <div class="spinner" style="display: block; width: 16px; height: 16px;"></div>
      <span>Carregando seu espaço...</span>
    </div>
  </div>

  <!-- Script da Interface -->
  <script type="module">
  
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  setPersistence,
  browserLocalPersistence,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  
  const firebaseConfig = {
  apiKey: "AIzaSyA02iDEhuslJ_FgM4hDKzf837sUHLDogk4",
  authDomain: "freestyle-ccad5.firebaseapp.com",
  projectId: "freestyle-ccad5",
  storageBucket: "freestyle-ccad5.firebasestorage.app",
  messagingSenderId: "349749139400",
  appId: "1:349749139400:web:193c902ee8de056c7412fd",
  measurementId: "G-6281J4HV5E"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
  
  onAuthStateChanged(auth, (user) => {
  if (user) {
    window.location.href = "index.html";
  }
});
  
  
    // Inicialização dos Ícones Lucide
    lucide.createIcons();

    const btn = document.getElementById('google-login-btn');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.getElementById('google-icon');
    const btnSpinner = document.getElementById('btn-spinner');
    const statusBox = document.getElementById('status-box');
    const statusText = document.getElementById('status-text');
    const statusIcon = document.getElementById('status-icon');
    const overlay = document.getElementById('redirect-overlay');

    

    /* Handler principal do clique no botão Google */
async function handleGoogleLogin() {
  try {
    btn.disabled = true;
    btnText.innerText = "Conectando...";
    
    await setPersistence(auth, browserLocalPersistence);

    const result = await signInWithPopup(auth, provider);

    const user = result.user;

    console.log("Login realizado com sucesso!");
    console.log("Nome:", user.displayName);
    console.log("E-mail:", user.email);
    console.log("UID:", user.uid);

    btnText.innerText = "Entrando...";
    
    window.location.href = "index.html";

  } catch (error) {
    console.error("Erro no login:", error);

    btn.disabled = false;
    btnText.innerText = "Continuar com Google";

    console.error(error.code);
  }
}
  
  window.handleGoogleLogin = handleGoogleLogin;

  </script>
</body>
</html>
